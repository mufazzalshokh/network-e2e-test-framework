stages: [quality, unit, build, e2e]

.python:
  image: python:3.12-slim-bookworm
  before_script:
    - python -m pip install -c requirements-dev.lock '.[dev]'

quality:
  extends: .python
  stage: quality
  script:
    - python -m ruff check .
    - python -m ruff format --check .
    - python -m mypy
    - nete2e check-config
    - nete2e --config environments/example.yaml check-config
    - python scripts/check_structure.py

unit:
  extends: .python
  stage: unit
  image: python:${PYTHON_VERSION}-slim-bookworm
  parallel:
    matrix:
      - PYTHON_VERSION: ['3.11', '3.12']
  script:
    - python -m pytest --junitxml=artifacts/unit.xml
  artifacts:
    when: always
    reports:
      junit: artifacts/unit.xml
    paths: [artifacts/unit.xml]

# These jobs use a dedicated Linux shell runner with Docker Engine, Compose v2
# and Python 3.11+. Docker access stays on the orchestration host.
build:
  stage: build
  tags: [docker-shell]
  resource_group: network-e2e-lab
  timeout: 20m
  script:
    - docker compose config --quiet
    - docker compose build

e2e:
  stage: e2e
  tags: [docker-shell]
  resource_group: network-e2e-lab
  timeout: 25m
  script:
    - python3 scripts/run_e2e.py --repeat 2 --scenarios
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: artifacts/**/baseline-*/junit.xml
    paths: [artifacts/]
